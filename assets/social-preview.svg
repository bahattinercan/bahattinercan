      <text x="54" y="204" font-size="11.5" fill="#e6edf3">POST /api/v1/auth/login</text>
      <rect x="46" y="216" width="216" height="20" rx="5" fill="#39d353" fill-opacity="0.16"/>
      <text x="54" y="230" font-size="11.5" fill="#e6edf3">GET  /api/v1/orders</text>
      <rect x="46" y="242" width="112" height="20" rx="5" fill="#39d353" fill-opacity="0.16"/>
