    <line x1="180" y1="276" x2="180" y2="322" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="286" y1="276" x2="286" y2="322" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7"/>

    <rect x="28" y="322" width="304" height="62" rx="12" fill="#131c26" stroke="#21262d"/>
    <g transform="translate(46 338)">
      <ellipse cx="15" cy="7" rx="15" ry="6" fill="#2dd4bf" fill-opacity="0.2"/>
      <path d="M0 7v14a15 6 0 0 0 30 0V7" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity="0.7"/>
