<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Bahattin Ercan — Computer Engineer. Django/DRF, Node.js, Flutter. 4+ yıl profesyonel deneyim, İngilizce C1.">
  <title>Bahattin Ercan — Computer Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.6" stop-color="#0d131b"/>
      <stop offset="1" stop-color="#101c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.1" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#39d353" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.95" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8b949e" fill-opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect x="-200" y="-160" width="1700" height="900" fill="url(#glow-a)"/>
  <rect x="-200" y="-160" width="1700" height="900" fill="url(#glow-b)"/>
  <rect x="0" y="0" width="8" height="640" fill="url(#accent)"/>
  <rect x="0" y="632" width="1280" height="8" fill="url(#edge)"/>

  <g font-family="'Segoe UI',Ubuntu,Roboto,Helvetica,Arial,sans-serif">
    <text x="88" y="164" font-size="17" font-weight="700" letter-spacing="5" fill="#39d353">COMPUTER&#160;ENGINEER</text>
    <text x="86" y="266" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-2">Bahattin Ercan</text>
    <text x="88" y="326" font-size="25" fill="#2dd4bf" font-weight="600">Django / DRF · Node.js · Flutter · TypeScript · PostgreSQL</text>
    <text x="88" y="382" font-size="19" fill="#8b949e">Kütahya, Türkiye · 4+ yıl profesyonel deneyim · İngilizce C1</text>
    <text x="88" y="418" font-size="19" fill="#8b949e">Yurt dışı remote ve Türkiye'de yerinde çalışmaya açık · hemen başlayabilirim</text>

    <g transform="translate(88 486)">
      <circle cx="7" cy="7" r="7" fill="#39d353"/>
      <text x="26" y="14" font-size="17" fill="#c9d1d9">github.com/bahattinercan</text>
    </g>
  </g>

  <!-- sağ: katman şeması -->
  <g transform="translate(852 118)">
    <rect width="360" height="404" rx="18" fill="#0f1620" fill-opacity="0.92" stroke="#21262d"/>
