    <text x="90" y="350" font-size="12" font-weight="700" letter-spacing="2.4" fill="#6e7681" font-family="'Segoe UI',Ubuntu,sans-serif">POSTGRESQL</text>
    <text x="90" y="370" font-size="12" fill="#6e7681" font-family="'Segoe UI',Ubuntu,sans-serif">şema tasarımı · migration · indeks</text>
