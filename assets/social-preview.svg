    <text x="46" y="178" font-size="12" font-weight="700" letter-spacing="2.4" fill="#6e7681" font-family="'Segoe UI',Ubuntu,sans-serif">API · DJANGO / DRF · NODE.JS</text>
    <g font-family="ui-monospace,Consolas,monospace">
