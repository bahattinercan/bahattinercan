    <text x="28" y="46" font-size="12" font-weight="700" letter-spacing="3" fill="#6e7681" font-family="'Segoe UI',Ubuntu,sans-serif">İSTEMCİLER</text>
    <g font-family="'Segoe UI',Ubuntu,sans-serif">
